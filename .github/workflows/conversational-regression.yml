name: Conversational regression tests

on:
  push:
    branches:
      - fix/conversational-budget-state
      - fix/option-c-state-integrity
      - work/consultant-reliability
  pull_request:
    branches:
      - main
      - feat/conversational-product-relevance

jobs:
  conversational-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile manual live smoke scripts
        run: python -m py_compile smoke_aliexpress.py smoke_conversational_search.py
      - name: Run focused offline tests
        run: >
          python -m pytest -q
          tests/test_ai_conversation_turn.py
          tests/test_convsearch_budget_followups.py
          tests/test_convsearch_turn_interpretation.py
          tests/test_convsearch_handler_clarification.py
          tests/test_convsearch_engine.py
          tests/test_convsearch_type_validation.py
          tests/test_search_service.py
          tests/test_eval_consultant_dialogue_dataset.py
          tests/test_eval_consultant_benchmark_runner.py
          tests/test_eval_consultant_auxiliary_dataset.py
          tests/test_ai_service.py::OperationAttributionTests
          tests/test_query_intent.py
          -k "not test_text_query_is_parsed_and_searched"
      - name: Run repository suite excluding stale legacy modules
        run: >
          python -m pytest -q tests/
          --ignore=tests/test_agent_service.py
          --ignore=tests/test_b3_routing_and_failures.py
          --ignore=tests/test_b6_conversational_flow.py
          --ignore=tests/test_conversation_integration.py
          --ignore=tests/test_stage19b_offline_runner.py
          --ignore=tests/test_stage19b_strict_addendum.py
          --ignore=tests/test_stage19c_offline.py
          --ignore=tests/test_stage21_classifier.py
          --ignore=tests/test_stage47_conversational.py
          --ignore=tests/test_stage49_followups.py
          --ignore=tests/test_variant_b_conversation.py
          --ignore=tests/test_discovery_acceptance.py
          --ignore=tests/test_gemini_telemetry.py
          --ignore=tests/test_ai_service.py
          --ignore=tests/test_latency_and_failures.py
          -k "not test_text_query_is_parsed_and_searched"
          --ignore=tests/test_result_limit_and_followup.py
          --ignore=tests/test_search_intent.py
          --ignore=tests/test_session_isolation.py
