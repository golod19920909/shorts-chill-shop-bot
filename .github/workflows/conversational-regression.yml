name: Conversational regression tests

on:
  push:
    branches:
      - fix/conversational-budget-state
  pull_request:
    branches:
      - main

jobs:
  conversational-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run full offline test suite
        run: python -m pytest -q tests
