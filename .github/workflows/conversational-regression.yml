name: Full bot audit regression tests

on:
  push:
    branches:
      - fix/conversational-budget-state
      - fix/option-c-state-integrity
      - fix/product-ranking-quality
  pull_request:
    branches:
      - main
      - feat/conversational-product-relevance
      - fix/product-ranking-quality

jobs:
  conversational-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile every tracked Python module
        run: python -m compileall -q .
      - name: Run focused offline tests
        run: >
          python -m pytest -q
          tests/test_ai_conversation_turn.py
          tests/test_ai_assistant_questions.py
          tests/test_convsearch_observability.py
          tests/test_currency_followup_preference.py
          tests/test_count_followup.py
          tests/test_region_currency_safety.py
          tests/test_ai_service.py
          tests/test_search_intent.py
          tests/test_convsearch_budget_followups.py
          tests/test_convsearch_turn_interpretation.py
          tests/test_convsearch_handler_clarification.py
          tests/test_convsearch_engine.py
          tests/test_convsearch_type_validation.py
          tests/test_convsearch_bare_type_switch.py
          tests/test_search_service.py
          tests/test_search_delivery_integrity.py
          tests/test_session_isolation.py
          tests/test_favorites_pagination.py
          tests/test_tracking_pagination.py
          tests/test_result_limit_current.py
          tests/test_gemini_telemetry_current.py
          tests/test_discovery_acceptance.py
      - name: Run full remaining repository suite
        run: >
          python -m pytest -q tests/
