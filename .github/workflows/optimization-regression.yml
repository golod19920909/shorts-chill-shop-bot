name: Performance and cost optimization regression

on:
  push:
    branches:
      - optimize/performance-costs
  pull_request:
    branches:
      - main

jobs:
  optimization-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile application packages
        run: python -m compileall -q bot config database handlers keyboards models services
      - name: Run optimization and protected-path offline regressions
        run: >
          python -m pytest -q
          tests/test_aliexpress_retry.py
          tests/test_search_dedup.py
          tests/test_convsearch_clarification_reuse.py
          tests/test_selector_snapshot_capture.py
          tests/test_gemini_pricing.py
          tests/test_gemini_telemetry.py
          tests/test_gemini_latency.py
          tests/test_ai_conversation_turn.py
          tests/test_convsearch_engine.py
          tests/test_search_service.py
          tests/test_eval_consultant_dialogue_dataset.py
          tests/test_eval_consultant_auxiliary_dataset.py
          tests/test_eval_consultant_optimization_dataset.py
          tests/test_eval_consultant_benchmark_runner.py
          -k "not test_timeout_recorded_without_behavior_change and not agent_failure_recorded_with_timeout_outcome and not agent_rounds_counted_once_per_round and not test_partial_mandatory_feature_stays_hidden_if_gemini_times_out and not test_thematic_full_pool_with_few_types_uses_bounded_deeper_page"
