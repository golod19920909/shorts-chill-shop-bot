name: Performance and cost optimization regression

on:
  push:
    branches:
      - optimize/performance-costs
  pull_request:
    branches:
      - main

jobs:
  optimization-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile application packages
        run: python -m compileall -q bot config database handlers keyboards models services
      - name: Run optimization and protected-path offline regressions
        run: >
          python -m pytest -q
          tests/test_aliexpress_retry.py
          tests/test_gemini_pricing.py
          tests/test_gemini_telemetry.py
          tests/test_gemini_latency.py
          tests/test_ai_conversation_turn.py
          tests/test_convsearch_engine.py
          tests/test_search_service.py
