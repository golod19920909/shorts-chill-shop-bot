name: Monetization audit regression

on:
  push:
    branches:
      - audit/aliexpress-portals-smoke-test
  pull_request:
    branches:
      - main
    paths:
      - "scripts/database_maintenance.py"
      - "handlers/search.py"
      - "keyboards/products.py"
      - "services/analytics.py"
      - "tests/test_affiliate_link_analytics.py"
      - "tests/test_database_maintenance.py"
      - "services/affiliate_orders.py"
      - "database/database.py"
      - "database/models.py"
      - "handlers/admin.py"
      - "keyboards/admin.py"
      - "tests/test_affiliate_orders.py"
      - "config/sales.py"
      - "handlers/sales.py"
      - "manage_sales.py"
      - "tests/test_sales_calendar.py"
      - "tests/test_admin_panel.py"
      - ".github/workflows/monetization-audit.yml"

jobs:
  monetization-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate deployment script syntax
        run: bash -n scripts/deploy_update.sh
      - name: Compile monetization code
        run: python -m py_compile scripts/database_maintenance.py scripts/deploy_update.sh scripts/diagnose_aliexpress_portals.py handlers/search.py handlers/admin.py keyboards/products.py keyboards/admin.py services/analytics.py services/affiliate_orders.py database/database.py database/models.py config/sales.py handlers/sales.py manage_sales.py
      - name: Run focused monetization tests
        run: python -m pytest -q tests/test_affiliate_link_analytics.py tests/test_database_maintenance.py tests/test_affiliate_orders.py tests/test_sales_calendar.py tests/test_admin_panel.py
